<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Цена букета</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --accent: #c2567f;
    --accent-soft: #f7e3ec;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, 'SF Pro Text', Roboto, sans-serif;
    background: var(--tg-theme-bg-color, #fff);
    color: var(--tg-theme-text-color, #111);
    padding: 12px 14px 90px;
  }
  h1 { font-size: 19px; margin: 6px 0 14px; }
  h1 span { color: var(--accent); }

  .tabs {
    display: flex; gap: 6px; margin-bottom: 16px;
    background: var(--tg-theme-secondary-bg-color, #f2f2f5);
    padding: 4px; border-radius: 12px;
  }
  .tabs button {
    flex: 1; border: 0; padding: 9px 0; border-radius: 9px;
    font-size: 14px; font-weight: 600; background: transparent;
    color: var(--tg-theme-hint-color, #888); cursor: pointer;
  }
  .tabs button.active {
    background: var(--tg-theme-bg-color, #fff);
    color: var(--accent); box-shadow: 0 1px 4px rgba(0,0,0,.08);
  }
  .page { display: none; }
  .page.active { display: block; }

  .card {
    background: var(--tg-theme-secondary-bg-color, #f7f7f9);
    border-radius: 14px; padding: 14px; margin-bottom: 12px;
  }
  .card h2 { font-size: 14px; margin-bottom: 10px; color: var(--tg-theme-hint-color, #888); font-weight: 600; }

  label { display: block; font-size: 12px; color: var(--tg-theme-hint-color, #888); margin: 8px 0 3px; }
  input, select {
    width: 100%; padding: 10px 12px; border-radius: 10px; font-size: 16px;
    border: 1px solid rgba(0,0,0,.08);
    background: var(--tg-theme-bg-color, #fff);
    color: var(--tg-theme-text-color, #111);
    outline: none;
  }
  input:focus { border-color: var(--accent); }
  .row { display: flex; gap: 8px; }
  .row > div { flex: 1; }

  button.primary {
    width: 100%; padding: 13px; border: 0; border-radius: 12px;
    background: var(--accent); color: #fff; font-size: 16px; font-weight: 700;
    margin-top: 10px; cursor: pointer;
  }
  button.ghost {
    border: 0; background: transparent; color: var(--accent);
    font-size: 14px; font-weight: 600; padding: 8px; cursor: pointer;
  }

  .flower-line {
    display: flex; align-items: center; gap: 8px; padding: 9px 0;
    border-bottom: 1px solid rgba(0,0,0,.05);
  }
  .flower-line:last-child { border-bottom: 0; }
  .flower-line .nm { flex: 1; font-size: 15px; }
  .flower-line .nm small { display: block; color: var(--tg-theme-hint-color, #999); font-size: 12px; }
  .qty { display: flex; align-items: center; gap: 8px; }
  .qty button {
    width: 30px; height: 30px; border-radius: 50%; border: 0; font-size: 17px;
    background: var(--accent-soft); color: var(--accent); font-weight: 700; cursor: pointer;
  }
  .qty b { min-width: 20px; text-align: center; font-size: 15px; }
  .del { color: #d33; font-size: 17px; border: 0; background: none; cursor: pointer; padding: 4px; }

  .price-hero {
    text-align: center; padding: 18px 14px; border-radius: 16px;
    background: linear-gradient(135deg, #c2567f, #8e3a5e);
    color: #fff; margin-bottom: 12px;
  }
  .price-hero .val { font-size: 38px; font-weight: 800; letter-spacing: .5px; }
  .price-hero .sub { font-size: 13px; opacity: .85; margin-top: 2px; }

  .break { font-size: 13.5px; }
  .break .line {
    display: flex; justify-content: space-between; padding: 6px 0;
    border-bottom: 1px dashed rgba(0,0,0,.07);
  }
  .break .line:last-child { border-bottom: 0; }
  .break .line b { font-variant-numeric: tabular-nums; }
  .break .line.profit { color: #1c8a4b; font-weight: 700; }

  .seg { display: flex; gap: 6px; margin-top: 4px; }
  .seg button {
    flex: 1; padding: 8px; border-radius: 9px; border: 1px solid rgba(0,0,0,.1);
    background: var(--tg-theme-bg-color,#fff); font-size: 13px; cursor: pointer;
    color: var(--tg-theme-text-color,#111);
  }
  .seg button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .alt-price { text-align: center; font-size: 13px; color: var(--tg-theme-hint-color,#888); margin-top: 8px; }
  .hint { font-size: 12px; color: var(--tg-theme-hint-color, #999); margin-top: 6px; }
</style>
</head>
<body>

<h1>💐 Калькулятор <span>цены букета</span></h1>

<div class="tabs">
  <button id="tab-calc" class="active" onclick="showPage('calc')">Букет</button>
  <button id="tab-flowers" onclick="showPage('flowers')">Цветы</button>
  <button id="tab-settings" onclick="showPage('settings')">Настройки</button>
</div>

<!-- ============ КАЛЬКУЛЯТОР ============ -->
<div class="page active" id="page-calc">
  <div class="price-hero">
    <div class="val" id="hero-price">0 ₽</div>
    <div class="sub" id="hero-sub">добавьте цветы в букет</div>
  </div>
  <div class="alt-price" id="alt-price"></div>

  <div class="card">
    <h2>СОСТАВ БУКЕТА</h2>
    <div id="calc-flowers"></div>
    <label>Общая упаковка букета, ₽</label>
    <input type="number" id="extra-pack" value="150" min="0" oninput="recalc()">
  </div>

  <div class="card">
    <h2>ЧТО ЗАШИТО В ЦЕНУ</h2>
    <div class="break" id="breakdown"></div>
  </div>
</div>

<!-- ============ СПРАВОЧНИК ============ -->
<div class="page" id="page-flowers">
  <div class="card">
    <h2>ДОБАВИТЬ ЦВЕТОК</h2>
    <label>Название</label>
    <input id="f-name" placeholder="Роза Эквадор 60 см">
    <div class="row">
      <div>
        <label>Закупка за стебель, ₽</label>
        <input id="f-price" type="number" min="0" placeholder="130">
      </div>
      <div>
        <label>Упаковка, ₽</label>
        <input id="f-pack" type="number" min="0" placeholder="0">
      </div>
    </div>
    <button class="primary" onclick="addFlower()">＋ Добавить</button>
  </div>
  <div class="card">
    <h2>МОЙ СПРАВОЧНИК</h2>
    <div id="flower-list"></div>
  </div>
</div>

<!-- ============ НАСТРОЙКИ ============ -->
<div class="page" id="page-settings">
  <div class="card">
    <h2>НАЛОГИ</h2>
    <label>Объект УСН</label>
    <div class="seg" id="seg-tax">
      <button data-v="usn6" onclick="setSeg('tax_mode','usn6')">Доходы 6%</button>
      <button data-v="usn15" onclick="setSeg('tax_mode','usn15')">Дох.−расх. 15%</button>
    </div>
    <div class="row">
      <div><label>НДС, %</label><input id="s-vat_rate" type="number" step="0.1" oninput="setNum('vat_rate',this.value)"></div>
      <div><label>Эквайринг, %</label><input id="s-acquiring_pct" type="number" step="0.1" oninput="setNum('acquiring_pct',this.value)"></div>
    </div>
    <label>Комиссия маркетплейса, %</label>
    <input id="s-marketplace_pct" type="number" step="0.1" oninput="setNum('marketplace_pct',this.value)">
  </div>

  <div class="card">
    <h2>СЕБЕСТОИМОСТЬ</h2>
    <div class="row">
      <div><label>Логистика, %</label><input id="s-logistics_pct" type="number" step="0.1" oninput="setNum('logistics_pct',this.value)"></div>
      <div><label>Убыль/списания, %</label><input id="s-waste_pct" type="number" step="0.1" oninput="setNum('waste_pct',this.value)"></div>
    </div>
    <label>Оплата флориста</label>
    <div class="seg" id="seg-florist">
      <button data-v="percent" onclick="setSeg('florist_mode','percent')">% от цены</button>
      <button data-v="fixed" onclick="setSeg('florist_mode','fixed')">фикс ₽</button>
    </div>
    <div class="row">
      <div><label>Флорист, % от цены</label><input id="s-florist_pct" type="number" step="0.1" oninput="setNum('florist_pct',this.value)"></div>
      <div><label>или фикс, ₽/букет</label><input id="s-florist_fixed" type="number" oninput="setNum('florist_fixed',this.value)"></div>
    </div>
  </div>

  <div class="card">
    <h2>ПОСТОЯННЫЕ И МАРЖА</h2>
    <div class="row">
      <div><label>Аренда+прочее, ₽/мес</label><input id="s-fixed_monthly" type="number" oninput="setNum('fixed_monthly',this.value)"></div>
      <div><label>План, букетов/мес</label><input id="s-planned_bouquets" type="number" oninput="setNum('planned_bouquets',this.value)"></div>
    </div>
    <label>Целевая чистая маржа, %</label>
    <input id="s-target_margin_pct" type="number" step="0.5" oninput="setNum('target_margin_pct',this.value)">
    <div class="hint">Все настройки хранятся на этом устройстве и применяются к расчёту мгновенно.</div>
  </div>
</div>

<script>
// ================== движок (порт pricing.py) ==================
const DEFAULTS = {
  tax_mode: "usn6", vat_rate: 5, acquiring_pct: 2, marketplace_pct: 0,
  waste_pct: 15, logistics_pct: 10, florist_mode: "percent",
  florist_pct: 10, florist_fixed: 150,
  fixed_monthly: 150000, planned_bouquets: 500, target_margin_pct: 25
};

let S = load("fpc_settings", {...DEFAULTS});
let flowers = load("fpc_flowers", []);      // [{name, price, pack}]
let bouquet = load("fpc_bouquet", {});      // {name: qty}

function load(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }
function save() {
  localStorage.setItem("fpc_settings", JSON.stringify(S));
  localStorage.setItem("fpc_flowers", JSON.stringify(flowers));
  localStorage.setItem("fpc_bouquet", JSON.stringify(bouquet));
}

const fmt = n => Math.round(n).toLocaleString("ru-RU") + " ₽";

function itemCost(f, qty) {
  let stem = f.price * (1 + S.logistics_pct / 100);
  stem = stem / (1 - S.waste_pct / 100);
  return stem * qty + (f.pack || 0) * qty;
}

function prettyPrice(p) {
  if (p < 500) return Math.ceil(p / 10) * 10;
  if (p < 3000) {
    const base = Math.floor(p / 50) * 50;
    for (const c of [base+50, base+90, base+100]) if (c >= p) return c;
  }
  const base = Math.floor(p / 100) * 100;
  for (const c of [base+90, base+100, base+150, base+190, base+200]) if (c >= p) return c;
  return base + 290;
}

function calc(items, extraPack, mode) {
  const cogs = items.reduce((a, [f, q]) => a + itemCost(f, q), 0);
  const fixedPer = S.fixed_monthly / Math.max(S.planned_bouquets, 1);
  const floristFix = S.florist_mode === "fixed" ? +S.florist_fixed : 0;
  const C = cogs + extraPack + fixedPer + floristFix;

  const v = S.vat_rate / 100;
  const netShare = 1 / (1 + v);
  let varPct = (S.acquiring_pct + S.marketplace_pct) / 100;
  if (S.florist_mode === "percent") varPct += S.florist_pct / 100;
  const m = S.target_margin_pct / 100;

  const denom = mode === "usn6"
    ? netShare * (1 - 0.06) - varPct - m
    : 0.85 * (netShare - varPct) - m;
  if (denom <= 0.05 || C <= 0) return null;

  const price = prettyPrice(C / denom);
  const vat = price * v / (1 + v);
  const rev = price - vat;
  const acq = price * (S.acquiring_pct + S.marketplace_pct) / 100;
  const flVar = S.florist_mode === "percent" ? price * S.florist_pct / 100 : 0;

  let tax, profit;
  if (mode === "usn6") {
    tax = rev * 0.06;
    profit = rev - tax - acq - flVar - C;
  } else {
    const b = Math.max(rev - acq - flVar - C, 0);
    tax = b * 0.15;
    profit = b - tax;
  }
  const raw = items.reduce((a, [f, q]) => a + f.price * q, 0);
  return { price, C, cogs, extraPack, fixedPer, floristFix, flVar, vat, tax, acq, profit,
           markup: raw > 0 ? price / raw : 0 };
}

// ================== UI ==================
function showPage(p) {
  document.querySelectorAll(".page").forEach(e => e.classList.remove("active"));
  document.querySelectorAll(".tabs button").forEach(e => e.classList.remove("active"));
  document.getElementById("page-" + p).classList.add("active");
  document.getElementById("tab-" + p).classList.add("active");
  if (p === "calc") renderCalc();
  if (p === "flowers") renderFlowers();
}

function bouquetItems() {
  return flowers.filter(f => bouquet[f.name] > 0).map(f => [f, bouquet[f.name]]);
}

function recalc() {
  const items = bouquetItems();
  const extra = +document.getElementById("extra-pack").value || 0;
  const hero = document.getElementById("hero-price");
  const sub = document.getElementById("hero-sub");
  const alt = document.getElementById("alt-price");
  const br = document.getElementById("breakdown");

  const r = calc(items, extra, S.tax_mode);
  if (!r) {
    hero.textContent = "0 ₽";
    sub.textContent = items.length ? "проверьте параметры расчёта" : "добавьте цветы в букет";
    alt.textContent = ""; br.innerHTML = "";
    return;
  }
  hero.textContent = fmt(r.price);
  sub.textContent = `себестоимость ${fmt(r.C)} · прибыль ${fmt(r.profit)} · наценка ×${r.markup.toFixed(1)}`;

  const other = calc(items, extra, S.tax_mode === "usn6" ? "usn15" : "usn6");
  if (other) alt.textContent = (S.tax_mode === "usn6"
    ? `При УСН «Доходы−расходы» 15%: ${fmt(other.price)}`
    : `При УСН «Доходы» 6%: ${fmt(other.price)}`);

  const lines = [
    ["Закупка + логистика + убыль", r.cogs],
    ["Упаковка", r.extraPack],
    ["Аренда на 1 букет", r.fixedPer],
  ];
  if (r.floristFix) lines.push(["Флорист (фикс)", r.floristFix]);
  if (r.flVar) lines.push(["Флорист (% от цены)", r.flVar]);
  lines.push(["НДС " + S.vat_rate + "%", r.vat]);
  lines.push([S.tax_mode === "usn6" ? "УСН 6% с дохода" : "УСН 15% с прибыли", r.tax]);
  lines.push(["Эквайринг/комиссии", r.acq]);
  br.innerHTML = lines.map(([l, v]) => `<div class="line"><span>${l}</span><b>${fmt(v)}</b></div>`).join("")
    + `<div class="line profit"><span>Чистая прибыль</span><b>${fmt(r.profit)}</b></div>`;
}

function renderCalc() {
  const box = document.getElementById("calc-flowers");
  if (!flowers.length) {
    box.innerHTML = `<div class="hint">Справочник пуст — добавьте цветы во вкладке «Цветы».</div>`;
  } else {
    box.innerHTML = flowers.map(f => `
      <div class="flower-line">
        <div class="nm">${f.name}<small>${fmt(f.price)} / стебель</small></div>
        <div class="qty">
          <button onclick="chgQty('${esc(f.name)}',-1)">−</button>
          <b>${bouquet[f.name] || 0}</b>
          <button onclick="chgQty('${esc(f.name)}',1)">＋</button>
        </div>
      </div>`).join("");
  }
  recalc();
}

function renderFlowers() {
  const box = document.getElementById("flower-list");
  box.innerHTML = flowers.length ? flowers.map(f => `
    <div class="flower-line">
      <div class="nm">${f.name}<small>закупка ${fmt(f.price)}${f.pack ? " + упак. " + fmt(f.pack) : ""}</small></div>
      <button class="del" onclick="delFlower('${esc(f.name)}')">🗑</button>
    </div>`).join("")
    : `<div class="hint">Пока пусто.</div>`;
}

function esc(s) { return s.replace(/'/g, "\\'"); }

function chgQty(name, d) {
  bouquet[name] = Math.max(0, (bouquet[name] || 0) + d);
  save(); renderCalc();
}
function addFlower() {
  const name = document.getElementById("f-name").value.trim();
  const price = +document.getElementById("f-price").value;
  const pack = +document.getElementById("f-pack").value || 0;
  if (!name || !(price >= 0)) { alert("Введите название и закупочную цену"); return; }
  const ex = flowers.find(f => f.name === name);
  if (ex) { ex.price = price; ex.pack = pack; } else flowers.push({ name, price, pack });
  document.getElementById("f-name").value = "";
  document.getElementById("f-price").value = "";
  document.getElementById("f-pack").value = "";
  save(); renderFlowers();
}
function delFlower(name) {
  flowers = flowers.filter(f => f.name !== name);
  delete bouquet[name];
  save(); renderFlowers();
}

function setNum(k, v) { S[k] = +v || 0; save(); recalc(); }
function setSeg(k, v) {
  S[k] = v; save(); syncSettingsUI(); recalc();
}

function syncSettingsUI() {
  for (const k of Object.keys(DEFAULTS)) {
    const el = document.getElementById("s-" + k);
    if (el) el.value = S[k];
  }
  for (const [id, k] of [["seg-tax", "tax_mode"], ["seg-florist", "florist_mode"]]) {
    document.querySelectorAll("#" + id + " button").forEach(b =>
      b.classList.toggle("on", b.dataset.v === S[k]));
  }
}

// ================== Telegram WebApp ==================
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

syncSettingsUI();
renderCalc();
</script>
</body>
</html>
